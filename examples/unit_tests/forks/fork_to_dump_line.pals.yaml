# A ring with a fork to a dump line whose first element is a BeginningEle of
# its own. Each branch numbers its elements independently: element_index
# restarts at one in the forked-to branch.
#
# From pals-cpp tests/test_bookkeeper.cpp
# ("element_index restarts at one in each branch").
PALS:
  facility:
    - dump_begin:
        kind: BeginningEle
        ReferenceP:
          species_ref: "electron"
          E_tot_ref: 1.0e9
    - dump_end:
        kind: Marker
    - dump_line:
        kind: BeamLine
        line:
          - dump_begin
          - dump_end
    - ring:
        kind: BeamLine
        line:
          - begin:
              kind: BeginningEle
              ReferenceP:
                species_ref: "electron"
                E_tot_ref: 1.0e9
          - drift1:
              kind: Drift
              length: 1.0
          - f1:
              kind: Fork
              ForkP:
                to_line: dump_line
    - lat1:
        kind: Lattice
        branches:
          - ring
    - use: "lat1"
