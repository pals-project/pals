# The functions available in expressions, each used once in a constant.
# The expected value of each is in its comment. Also used: random() (uniform
# in [0, 1)), and the species functions mass_of, charge_of (+2 for "#3He+2"),
# and anomalous_moment_of.
PALS:
  facility:
    - constants:
        - f_sqrt: sqrt(2)       # 1.414213562
        - f_exp: exp(0.1)      # 1.105170918
        - f_log: log(10)       # 2.302585093
        - f_sin: sin(0.5)      # 0.4794255386
        - f_cos: cos(0.5)      # 0.8775825619
        - f_tan: tan(0.5)      # 0.5463024898
        - f_cot: cot(0.5)      # 1.830487722
        - f_sinc: sinc(0.3)     # 0.9850673555
        - f_asin: asin(0.5)     # 0.5235987756
        - f_acos: acos(0.5)     # 1.047197551
        - f_atan: atan(1)       # 0.7853981634
        - f_atan2: atan2(1, -1)  # 2.35619449
        - f_sinh: sinh(1)       # 1.175201194
        - f_cosh: cosh(1)       # 1.543080635
        - f_tanh: tanh(1)       # 0.761594156
        - f_coth: coth(1)       # 1.313035285
        - f_asinh: asinh(1)      # 0.881373587
        - f_acosh: acosh(2)      # 1.316957897
        - f_atanh: atanh(0.5)    # 0.5493061443
        - f_acoth: acoth(2)      # 0.5493061443
        - f_abs: abs(-3.2)     # 3.2
        - f_fact: factorial(4)  # 24
        - f_int: int(-2.7)     # -2
        - f_nint: nint(2.4)     # 2
        - f_sign: sign(-3)      # -1
        - f_floor: floor(-2.5)   # -3
        - f_ceil: ceiling(2.1)  # 3
        - f_mod: modulo(7, 3)  # 1
        - f_mass: mass_of("proton")
        - f_charge: charge_of("#3He+2")
        - f_anom: anomalous_moment_of("electron")
    - variables:
        - f_random: random()
    - begin:
        kind: BeginningEle
        ReferenceP:
          species_ref: "electron"
          E_tot_ref: 1.0e9
    - d1:
        kind: Drift
        length: f_sqrt + f_random
    - main:
        kind: BeamLine
        line:
          - begin
          - d1
    - lat1:
        kind: Lattice
        branches:
          - main
    - use: "lat1"
