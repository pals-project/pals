# Constants and variables in their long form, with `kind: constant` and
# `kind: variable`. A constant can carry a relative_error. Here my_const =
# 1.45 * c_light and my_var = 37; d1 has length my_var / 37 * 2 = 2.
#
# From the Constants and Variables section of the standard.
PALS:
  facility:
    - my_const:
        kind: constant
        value: 1.45 * c_light
        relative_error: 0.02
    - my_var:
        kind: variable
        value: 37
    - begin:
        kind: BeginningEle
        ReferenceP:
          species_ref: "electron"
          E_tot_ref: 1.0e9
    - d1:
        kind: Drift
        length: my_var / 37 * 2
    - q1:
        kind: Quadrupole
        length: 0.5
        MagneticMultipoleP:
          Bn1: my_const / c_light
    - main:
        kind: BeamLine
        line:
          - begin
          - d1
          - q1
    - lat1:
        kind: Lattice
        branches:
          - main
    - use: "lat1"
