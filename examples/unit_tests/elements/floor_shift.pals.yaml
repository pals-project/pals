# A FloorShift element shifts the reference curve in the global coordinate
# system. Its exit is placed 0.5 m along x from the exit of the previous
# element (d1) and rotated by 0.1 rad about z. Downstream elements (d2) move
# with it; upstream elements do not.
PALS:
  facility:
    - begin:
        kind: BeginningEle
        ReferenceP:
          species_ref: "electron"
          E_tot_ref: 1.0e9
    - d1:
        kind: Drift
        length: 2.0
    - shift:
        kind: FloorShift
        CoordinateSetP:
          origin_ele: PREVIOUS_ELEMENT
        BodyShiftP:
          x_offset: 0.5
          z_rot: 0.1
    - d2:
        kind: Drift
        length: 2.0
    - main:
        kind: BeamLine
        line:
          - begin
          - d1
          - shift
          - d2
    - lat1:
        kind: Lattice
        branches:
          - main
    - use: "lat1"
