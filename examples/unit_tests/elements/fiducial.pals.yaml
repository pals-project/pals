# A Fiducial element fixes the floor position of the reference orbit at its
# location, here 1.0 m along the global x-axis and 5.0 m along the global
# z-axis from the global origin. Elements upstream (d1) and downstream (d2)
# are positioned relative to it.
PALS:
  facility:
    - begin:
        kind: BeginningEle
        ReferenceP:
          species_ref: "electron"
          E_tot_ref: 1.0e9
    - d1:
        kind: Drift
        length: 2.0
    - fid:
        kind: Fiducial
        CoordinateSetP:
          origin_ele: GLOBAL_ORIGIN
        BodyShiftP:
          x_offset: 1.0
          z_offset: 5.0
    - d2:
        kind: Drift
        length: 2.0
    - main:
        kind: BeamLine
        line:
          - begin
          - d1
          - fid
          - d2
    - lat1:
        kind: Lattice
        branches:
          - main
    - use: "lat1"
